<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Adhithya J</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
      transition: background .5s, color .5s;
    }
    body.light { background: #f5f5f7; color: #1a1a2e; }

    .loader { position: fixed; inset: 0; z-index: 9999; background: #0a0a0f; display: flex; align-items: center; justify-content: center; transition: opacity .6s, visibility .6s; }
    .loader.hidden { opacity: 0; visibility: hidden; }
    .loader-ring { width: 48px; height: 48px; border: 3px solid rgba(129,140,248,0.2); border-top-color: #818cf8; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }
    body.light ::-webkit-scrollbar-track { background: #f5f5f7; }
    body.light ::-webkit-scrollbar-thumb { background: #ccc; }

    .theme-toggle {
      position: fixed; top: 1.5rem; right: 1.5rem; z-index: 100;
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer; transition: all .3s; color: #888;
    }
    .theme-toggle:hover { background: rgba(129,140,248,0.1); border-color: rgba(129,140,248,0.3); color: #fff; }
    body.light .theme-toggle { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }
    .theme-toggle svg { width: 20px; height: 20px; fill: currentColor; }

    .glow { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; transition: opacity .5s; }
    .glow-1 { width: 400px; height: 400px; background: rgba(99,102,241,0.08); top: -100px; left: -100px; }
    .glow-2 { width: 500px; height: 500px; background: rgba(168,85,247,0.06); bottom: -150px; right: -100px; }
    body.light .glow { opacity: 0.5; }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 3rem 2rem;
      transition: all .5s;
      animation: fadeIn .8s ease;
    }
    body.light .card { background: #fff; border-color: rgba(0,0,0,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    h1 { font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 0.4rem; }
    body.light h1 { color: #1a1a2e; }
    h1 span { background: linear-gradient(135deg, #818cf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.sub { color: #888; font-size: 0.9rem; line-height: 1.6; margin-bottom: 2rem; }
    body.light p.sub { color: #666; }

    form { display: flex; flex-direction: column; gap: 1rem; }
    form input, form textarea {
      padding: 1rem 1.2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03); color: #e0e0e0; font-family: 'Inter', sans-serif;
      font-size: 0.9rem; outline: none; transition: all 0.3s;
    }
    body.light form input, body.light form textarea { background: #f5f5f7; border-color: rgba(0,0,0,0.1); color: #1a1a2e; }
    form input:focus, form textarea:focus { border-color: rgba(99,102,241,0.3); background: rgba(255,255,255,0.05); }
    body.light form input:focus, body.light form textarea:focus { border-color: rgba(99,102,241,0.5); background: #fff; }
    form textarea { min-height: 130px; resize: vertical; }

    .btn {
      padding: 1rem 2rem; border-radius: 12px; font-weight: 600; font-size: 0.9rem;
      border: none; cursor: pointer; transition: all 0.3s;
      background: linear-gradient(135deg, #818cf8, #a855f7);
      color: #fff;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.3); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .social { display: flex; justify-content: center; gap: 1rem; margin-top: 2rem; }
    .social a {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      text-decoration: none; color: #888; transition: all 0.3s;
    }
    body.light .social a { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.08); }
    .social a:hover { color: #fff; border-color: rgba(99,102,241,0.3); background: rgba(99,102,241,0.1); transform: translateY(-2px); }
    body.light .social a:hover { color: #818cf8; }
    .social a svg { width: 20px; height: 20px; fill: currentColor; }

    .toast {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 200;
      padding: 1rem 1.5rem; border-radius: 12px;
      background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.2);
      color: #22c55e; font-size: 0.9rem; font-weight: 500;
      transform: translateY(100px); opacity: 0;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    .back-link {
      display: inline-flex; align-items: center; gap: .5rem;
      color: #888; font-size: .85rem; margin-bottom: 2rem;
      transition: color .3s; text-decoration: none;
    }
    .back-link:hover { color: #fff; }
    body.light .back-link:hover { color: #1a1a2e; }
    .back-link svg { width: 16px; height: 16px; fill: currentColor; }

    @media (max-width: 500px) {
      .card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
<div class="loader"><div class="loader-ring"></div></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
  <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
</button>

<div class="toast" id="toast">Message sent successfully!</div>

<div class="card">
  <a href="https://mystry112000.github.io/About-Me/" class="back-link">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Back to portfolio
  </a>
  <h1>Let's <span>Connect</span></h1>
  <p class="sub">Got a question, a collab idea, or just wanna say hi? Drop a message and I'll get back to you.</p>
  <form id="contactForm">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <textarea name="message" placeholder="Your Message" required></textarea>
    <button type="submit" class="btn">Send Message</button>
  </form>
  <div class="social">
    <a href="https://github.com/mystry112000" target="_blank" title="GitHub">
      <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
    </a>
    <a href="https://discord.com/users/1450531025347281008" target="_blank" title="Discord: adamentk_knight_07_89371">
      <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
    </a>
  </div>
</div>

<script>
  window.addEventListener('load', () => document.querySelector('.loader').classList.add('hidden'))

  const form = document.getElementById('contactForm')
  const toast = document.getElementById('toast')
  const btn = form.querySelector('button')

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    btn.textContent = 'Sending...'
    btn.disabled = true
    try {
      await fetch('https://formspree.io/f/xzdwpqde', {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      })
    } catch {}
    toast.textContent = 'Message sent! I\'ll get back to you soon.'
    toast.className = 'toast show'
    setTimeout(() => toast.className = 'toast', 4000)
    form.reset()
    btn.textContent = 'Send Message'
    btn.disabled = false
  })

  const toggle = document.getElementById('themeToggle')
  const saved = localStorage.getItem('theme')
  if (saved === 'light') { document.body.classList.add('light'); toggle.querySelector('svg').innerHTML = '<path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>'; }

  toggle.addEventListener('click', () => {
    document.body.classList.toggle('light')
    const isLight = document.body.classList.contains('light')
    localStorage.setItem('theme', isLight ? 'light' : 'dark')
    toggle.querySelector('svg').innerHTML = isLight
      ? '<path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>'
      : '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>'
  })
</script>
</body>
</html>
